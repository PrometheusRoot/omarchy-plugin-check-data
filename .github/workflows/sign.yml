name: sign

# Keyless-sign our provider feed (spec/PROTOCOL.md §2-3, ADR-0039 in PrometheusRoot/omarchy-plugin-check).
# Signs only what the owner committed to master: never on pull-request events, never for other
# actors. The certificate identity is this file on refs/heads/master, which providers.json pins.
#   sign:   opc-feed check → cosign attest-blob --statement per new statement → opc-feed index →
#           cosign sign-blob the index → self-check with the aggregator's verifier (no secrets,
#           no write access)
#   commit: write back only the bundles and the index, wait until the feed URL serves them,
#           start publish.yml

on:
  push:
    branches: [master]
    paths: ["feed/**"]
  schedule:
    - cron: "23 3 * * 1" # weekly re-index: an index expires 30 days after it is generated
  workflow_dispatch:

permissions: {}

concurrency:
  group: feed
  cancel-in-progress: false

env:
  # The public tool (opc-feed, aggregator) at a reviewed commit; bump together with publish.yml.
  OPC_TOOL_REPO: PrometheusRoot/omarchy-plugin-check
  OPC_TOOL_COMMIT: 47f0aeef2a4c08344e0ec34248232a180c0c7016 # master after PR #2 (ADR-0039)
  PROVIDER: opc

jobs:
  sign:
    name: Sign new statements and the index
    if: >-
      github.repository == 'PrometheusRoot/omarchy-plugin-check-data'
      && github.ref == 'refs/heads/master'
      && (github.event_name == 'schedule' || github.actor == 'PrometheusRoot')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Fulcio certificate for this workflow's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: data
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.OPC_TOOL_REPO }}
          ref: ${{ env.OPC_TOOL_COMMIT }}
          path: tool
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the public tool (hash-pinned dependencies)
        run: data/ci/install-tool.sh tool

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Check every statement; list the unsigned ones
        run: |
          opc-feed check data/feed/v1 --provider "$PROVIDER" > "$RUNNER_TEMP/pending"
          echo "statements to sign: $(wc -l < "$RUNNER_TEMP/pending")"

      - name: Sign new statements (cosign attest-blob --statement, keyless)
        working-directory: data/feed/v1
        run: |
          while IFS= read -r rel; do
            [[ $rel =~ ^statements/[A-Za-z0-9][A-Za-z0-9._-]*/[0-9a-f]{40}\.json$ ]] || exit 1
            cosign attest-blob --yes --statement "$rel" --bundle "${rel%.json}.sigstore.json"
          done < "$RUNNER_TEMP/pending"

      - name: Rebuild and sign the index (cosign sign-blob, keyless)
        working-directory: data/feed/v1
        run: |
          opc-feed index . --provider "$PROVIDER"
          cosign sign-blob --yes --bundle index.json.sigstore.json index.json

      - name: Self-check with the aggregator's Sigstore verifier and the registry identity
        run: data/ci/selfcheck-feed.sh data "$PROVIDER" "$RUNNER_TEMP/selfcheck"

      - name: Collect the signed files
        working-directory: data
        run: |
          mkdir -p "$RUNNER_TEMP/signed"
          git ls-files --others --modified -- feed/v1 \
            | grep -E '^feed/v1/(index\.json|index\.json\.sigstore\.json|statements/[A-Za-z0-9][A-Za-z0-9._-]*/[0-9a-f]{40}\.sigstore\.json)$' \
            | tee "$RUNNER_TEMP/signed/files.txt"
          tar -cf "$RUNNER_TEMP/signed/feed.tar" -T "$RUNNER_TEMP/signed/files.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-feed
          path: ${{ runner.temp }}/signed
          retention-days: 7
          if-no-files-found: error

  commit:
    name: Commit the bundles and start publish
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the bundles and the index
      actions: write # start publish.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # exactly the commit that was signed; the push fails if master moved
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-feed
          path: ${{ runner.temp }}/signed

      - name: Commit the bundles and the index (nothing else)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/signed/files.txt"
          # Only the expected paths, and never a statement or an existing bundle.
          if grep -vE '^feed/v1/(index\.json|index\.json\.sigstore\.json|statements/[A-Za-z0-9][A-Za-z0-9._-]*/[0-9a-f]{40}\.sigstore\.json)$' "$list"; then
            echo "refusing unexpected paths (above)" >&2
            exit 1
          fi
          [[ "$(tar -tf "$RUNNER_TEMP/signed/feed.tar" | sort)" == "$(sort "$list")" ]]
          while IFS= read -r f; do
            [[ $f == feed/v1/index.json* || ! -e $f ]] || { echo "refusing to replace $f" >&2; exit 1; }
          done < "$list"
          tar -xf "$RUNNER_TEMP/signed/feed.tar"
          version=$(jq -r .version feed/v1/index.json)
          signed=$(grep -c '\.sigstore\.json$' "$list" || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --pathspec-from-file="$list"
          git commit -q -m "chore(feed): sign the feed, index version $version" \
            -m "$((signed - 1)) new statement bundle(s); signed by .github/workflows/sign.yml (run $GITHUB_RUN_ID)."
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/master
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Wait until the feed URL serves the new index (raw.githubusercontent.com caches ~5 min)
        run: |
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/master/feed/v1/index.json"
          for _ in $(seq 60); do
            if [[ "$(curl -fsSL --proto '=https' "$url" | jq -r .version 2> /dev/null)" == "$VERSION" ]]; then
              echo "served: version $VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "the feed URL did not serve version $VERSION within 10 minutes" >&2
          exit 1

      - name: Start publish.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref master
